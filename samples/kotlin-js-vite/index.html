<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotlin/JS + Vite Demo</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
        }
        h1 {
            margin: 0 0 0.5rem 0;
            color: #333;
        }
        p {
            color: #666;
            margin: 0.5rem 0;
        }
        .console-output {
            background: #1e1e1e;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-top: 1.5rem;
            text-align: left;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9rem;
            color: #d4d4d4;
            max-height: 300px;
            overflow-y: auto;
        }
        .console-output .log {
            margin: 0.25rem 0;
        }
        .console-output .prefix {
            color: #6a9955;
        }
        .hint {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kotlin/JS + Vite Demo</h1>
        <p>Built with KBuild incremental compilation</p>
        <p>Open the browser console (F12) to see Kotlin output</p>
        <div class="console-output" id="output">
            <div class="log"><span class="prefix">&gt;</span> Loading Kotlin/JS...</div>
        </div>
        <p class="hint">Edit src/Main.kt and save to see incremental compilation</p>
    </div>

    <script>
        // Capture console.log output for display
        const output = document.getElementById('output');
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const div = document.createElement('div');
            div.className = 'log';
            div.innerHTML = '<span class="prefix">&gt;</span> ' + args.join(' ');
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        };
    </script>
    <script type="module" src="./build/js/app.mjs"></script>
</body>
</html>
